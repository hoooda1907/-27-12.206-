:root[data-theme=light]{--bg:#eef1ee;--c:#ffffff;--c2:#f1f5f2;--t:#1b2a22;--m:#53665a;--b:#c6d2c9;--p:#0a7a46;--pt:#ffffff;--p2:#0a7a46;--hi:#8a5600;--a:#f2b84b;--at:#2a1c00;--r:#b9382d;--rt:#ffffff;--wb:#fff3cf;--wt:#5a4200;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:17px/1.55 "Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif}
button,input,select{font:inherit}
.i{width:1.25em;height:1.25em;vertical-align:-.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{background:var(--c);color:var(--t);border-bottom:3px solid var(--p2);display:flex;align-items:center;gap:10px;padding:8px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.lg{width:44px;height:auto;background:#fff;border-radius:10px;padding:3px}header b{font-size:20px;flex:1;color:var(--t)}header small{color:var(--m);font-size:15px;display:inline-flex;align-items:center;gap:4px}
nav{display:flex;gap:8px;padding:10px;background:var(--c);border-bottom:1px solid var(--b);overflow-x:auto}
nav button{flex:1;min-width:92px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:17px;font-weight:600;padding:12px 6px;border:2px solid var(--b);background:var(--c2);color:var(--t);border-radius:12px;cursor:pointer;white-space:normal;text-align:center}
nav button.on{background:var(--p);color:var(--pt);border-color:var(--p2)}
main{padding:12px;max-width:1200px;margin:auto}
.card{background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;color:var(--p2);font-size:20px;display:flex;align-items:center;gap:8px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
input,select{background:var(--c2);color:var(--t);border:2px solid var(--b);border-radius:10px;padding:10px 12px;min-width:0;font-size:18px}
input::placeholder{color:var(--m);opacity:1}
input:focus,select:focus{border-color:var(--a);outline:none}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--p2);vertical-align:middle}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--p);color:var(--pt);border:2px solid transparent;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:17px}
.btn.a{background:var(--a);color:var(--at)}.btn.r{background:var(--r);color:var(--rt)}.btn.o{background:transparent;color:var(--t);border-color:var(--p2)}
.btn:hover{filter:brightness(1.1)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;border-bottom:1px solid var(--b);text-align:right;white-space:nowrap;color:var(--t);font-size:16px}th{color:var(--m);font-weight:600}tr:nth-child(even) td{background:var(--c2)}
.big{font-size:28px;font-weight:800;color:var(--hi)}.k{color:var(--m);font-size:15px}
.clk{text-align:center;font-size:clamp(46px,10vw,90px);font-weight:700;direction:ltr;margin:6px 0;color:var(--hi);letter-spacing:2px}
.warn{background:var(--wb);color:var(--wt);border:1px solid var(--a);border-radius:10px;padding:10px 12px;margin:8px 0}
label{display:block;color:var(--t)}
#ts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#10151c;color:#fff;padding:12px 20px;border-radius:12px;z-index:50;display:none;max-width:92vw;pointer-events:none;box-shadow:0 4px 14px #0007;text-align:center;font-size:17px;border:1px solid #455366}#ts.er{background:var(--r);border-color:#e68a84}
#md{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:20;padding:12px}#md>div{background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--b);border-radius:10px;margin:8px 0;cursor:pointer;background:var(--c2)}.opt input{margin-top:5px;flex:none}input[type=radio]{width:20px;height:20px;accent-color:var(--p2)}
.scopebtn{font-size:19px;padding:12px 18px}header{flex-wrap:wrap}
#lg{max-width:360px;margin:8vh auto 0;text-align:center}#lg img{background:#fff;border-radius:14px;padding:8px}#ft{text-align:center;font-size:12px;color:var(--m);padding:14px}

function wbAgg(res){const H=["معرف خارجي","الباركود","الاسم","cost","price","الكمية في اليد","الكمية المحسوبة","وحدة القياس","الموقع","فئة المنتج","تصحيح الفئة","عدد الملفات"],
 row=e=>({"معرف خارجي":e.ext,"الباركود":String(e.bc),"الاسم":e.n,"cost":e.cost,"price":e.price,"الكمية في اليد":e.sys,"الكمية المحسوبة":e.cnt,"وحدة القياس":e.unit,"الموقع":e.loc,"فئة المنتج":e.cat||"","تصحيح الفئة":e.fix||"","عدد الملفات":e.nf}),w=XLSX.utils.book_new();
 [[res.stock,"منتجات في المخزون"],[res.non,"منتجات ليست في المخزون"]].forEach(([a,n])=>{const s=XLSX.utils.json_to_sheet(a.map(row),{header:H});s["!cols"]=[{wch:28},{wch:16},{wch:40},{wch:10},{wch:10},{wch:14},{wch:14},{wch:12},{wch:14},{wch:18},{wch:18},{wch:12}];XLSX.utils.book_append_sheet(w,s,n)});return w}
function wbRep(rows,S){const H=["معرف خارجي","الباركود","الاسم","التكلفة","الكمية في اليد","الكمية المحسوبة","الفرق","قيمة اليد","قيمة المحسوبة","قيمة الفرق","الحالة","فئة المنتج","تصحيح الفئة"],L=rows.length+1,T=L+1,Q="'تقرير الجرد'!";
 const aoa=[H].concat(rows.map(r=>[r.ext,String(r.bc),r.n,r.cost,r.sys,r.cnt,r.diff,r.vSys,r.vCnt,r.vDiff,r.st,r.cat||"",r.fix||""]));aoa.push(["الإجمالي","","","","","","",r2(rows.reduce((a,r)=>a+r.vSys,0)),S.cnt,r2(rows.reduce((a,r)=>a+r.vDiff,0)),"","",""]);
 const ws=XLSX.utils.aoa_to_sheet(aoa),F=(c,v,f)=>{ws[c]={t:"n",v,f}};
 rows.forEach((r,i)=>{const n=i+2;F("G"+n,r.diff,"F"+n+"-E"+n);F("H"+n,r.vSys,"D"+n+"*E"+n);F("I"+n,r.vCnt,"D"+n+"*F"+n);F("J"+n,r.vDiff,"D"+n+"*G"+n)});
 ["H","I","J"].forEach(c=>F(c+T,ws[c+T].v,"SUM("+c+"2:"+c+L+")"));
 ws["!cols"]=[{wch:28},{wch:16},{wch:40},{wch:10},{wch:14},{wch:14},{wch:10},{wch:12},{wch:14},{wch:12},{wch:16},{wch:18},{wch:18}];ws["!autofilter"]={ref:"A1:M"+L};
 const sm=XLSX.utils.aoa_to_sheet([["البند","القيمة"],["عدد الأصناف المجرودة",S.n],["إجمالي تكلفة الكميات المجرودة",S.cnt],["عدد الأصناف التي لها كمية في اليد",S.nSys],["إجمالي تكلفة المنتجات التي لها كمية في اليد",S.sys],["الفرق (المجرود − اليد)",S.net],["النتيجة",S.res],["إجمالي قيمة العجز على الأصناف",S.short],["إجمالي قيمة الزيادة على الأصناف",S.over]]);
 const G=(c,v,f,t)=>{sm[c]={t:t||"n",v,f}};
 G("B3",S.cnt,Q+"I"+T);G("B4",S.nSys,'COUNTIF('+Q+'E2:E'+L+',">0")');G("B5",S.sys,'SUMIF('+Q+'E2:E'+L+',">0",'+Q+'H2:H'+L+')');G("B6",S.net,"B3-B5");G("B7",S.res,'IF(B6<0,"عجز",IF(B6>0,"زيادة","مطابق"))',"s");G("B8",S.short,'SUMIF('+Q+'J2:J'+L+',"<0")');G("B9",S.over,'SUMIF('+Q+'J2:J'+L+',">0")');
 sm["!cols"]=[{wch:46},{wch:18}];const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,ws,"تقرير الجرد");XLSX.utils.book_append_sheet(w,sm,"ملخص الجرد");return w}
const agExpA=()=>dl(wbAgg(AG.res),"تجميع الجرد - المنتجات "+isoD()+".xlsx","تجميع الجرد");
const agExpR=()=>dl(wbRep(sortRows(AG.rows,AG.ord,AG.dir),AG.S),"تقرير الجرد "+isoD()+".xlsx","تجميع الجرد");
async function agExpAll(){await agExpA();await agExpR()}
/* ---------- لوحة المفاتيح ---------- */
document.addEventListener("input",e=>{const t=e.target;if(!t||t.tagName!="INPUT"||!t.dataset.d)return;const v=t.value;if(!/[٠-٩۰-۹]/.test(v))return;
 if(t.dataset.d=="all"||/^[\s0-9٠-٩۰-۹]+$/.test(v)){const p=t.selectionStart;t.value=nd(v);try{t.setSelectionRange(p,p)}catch(x){}}},true);
document.addEventListener("keydown",e=>{
 const k=e.key,modalOpen=$("#md").style.display=="grid";
 if(k=="Escape"){if(modalOpen)closeM();else if(me&&view=="count"&&cc){cc=null;R.count()}return}
 if(!me)return;
 if(k=="F2"){const x=$("#bc")||$("#pq");if(x){e.preventDefault();x.focus();x.select()}return}
 if(e.code=="KeyS"&&(e.ctrlKey||e.metaKey)&&view=="count"&&CS){e.preventDefault();expInv();return}
 if(k!="ArrowDown"&&k!="ArrowUp"&&k!="ArrowLeft"&&k!="ArrowRight")return;
 if(e.ctrlKey||e.altKey||e.metaKey||e.shiftKey)return;
 const t=e.target,tg=t.tagName;if(tg=="SELECT"||tg=="TEXTAREA"||(tg=="INPUT"&&t.type=="radio"))return;
 const isTxt=tg=="INPUT"&&!["checkbox","radio","button","file"].includes(t.type);
 if(isTxt&&(k=="ArrowLeft"||k=="ArrowRight"))return;
 if(isTxt&&t.hasAttribute("list"))return;
 const root=modalOpen?$("#mc"):$("#app"),L=[...root.querySelectorAll("input,button,select,textarea")].filter(x=>!x.disabled&&x.type!="hidden"&&x.type!="file"&&x.offsetParent!==null),i=L.indexOf(t);if(i<0)return;
 const j=i+((k=="ArrowDown"||k=="ArrowLeft")?1:-1);if(j<0||j>=L.length)return;
 e.preventDefault();L[j].focus();if(L[j].tagName=="INPUT"&&L[j].select)try{L[j].select()}catch(x){}});
draw();

</script></body></html>
